<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover — чтобы кадр шёл под вырезы экрана, а не в рамке;
     отключённый зум — чтобы двойное касание на джойстике не увеличивало
     страницу вместо управления кораблём. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- «На экран Домой» на iPhone: полноэкранного режима там нет вовсе
     (Safari даёт его только видео), и это единственный способ убрать
     адресную строку. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>ELITE :: Solar Trader</title>
<!-- Свежий код на каждой перезагрузке: метка загрузки приписывается к
     адресам всех модулей, иначе браузер продолжает брать их из кеша и
     помогает только Ctrl+F5. Почему так — в cache.js.
     document.write здесь не архаизм, а единственный синхронный способ:
     таблица импортов обязана встать раньше первого модуля. -->
<script>document.write('<scr' + 'ipt src="cache.js?v=' + (window.__srcStamp = Date.now().toString(36)) + '"></scr' + 'ipt>');</script>
</head>
<body>
<!-- 3D-сцена: WebGL2, а при его отсутствии — Canvas 2D -->
<!-- Невидимая распорка: через неё читаются вырезы экрана
     (env(safe-area-inset-*)), потому что из JS их иначе не спросить. -->
<div id="safe"></div>

<canvas id="screen"></canvas>
<!-- Приборная панель отдельным прозрачным слоем поверх сцены -->
<canvas id="hud"></canvas>

<div id="overlay" class="overlay hidden">
  <div class="panel" id="panel"></div>
</div>

<div id="boot" class="overlay">
  <div class="panel">
    <!-- Текст стартового экрана собирает игра (js/ui/screens.js): он
         переводится, а здесь остаётся только каркас. -->
    <div class="langs">
      <button class="btn ghost" id="langEn">ENGLISH</button>
      <button class="btn ghost" id="langRu">РУССКИЙ</button>
    </div>
    <div id="bootBody"></div>
    <button class="btn" id="bootBtn">ВЗЛЁТ</button>
    <button class="btn ghost" id="fsBtn" style="display:none">ВО ВЕСЬ ЭКРАН</button>
  </div>
</div>

<!-- Точка входа — загрузчик, а не сама игра: характеристики корабля
     приходят из бэкенда, и игра стартует после них (js/boot.js).
     Адрес ставится скриптом: таблица импортов переписывает импорты
     ВНУТРИ модулей, а адрес тега script — нет. -->
<script id="srcEntry">
(function () {
  var s = document.createElement('script');
  s.type = 'module';
  s.src = 'js/boot.js' + (window.__srcStamp ? '?v=' + window.__srcStamp : '');
  document.body.appendChild(s);
})();
</script>
</body>
</html>
