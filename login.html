<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SOLAR TRADER :: login</title>
<!-- Свежий код на каждой перезагрузке: метка загрузки приписывается к
     адресам всех модулей, иначе браузер продолжает брать их из кеша и
     помогает только Ctrl+F5. Почему так — в cache.js.
     document.write здесь не архаизм, а единственный синхронный способ:
     таблица импортов обязана встать раньше первого модуля. -->
<script>document.write('<scr' + 'ipt src="cache.js?v=' + (window.__srcStamp = Date.now().toString(36)) + '"></scr' + 'ipt>');</script>
<style>
  /* Форма входа — единственное место в игре, где есть поля ввода,
     поэтому их вид описан здесь, а не в общем стиле: тащить в него
     правила ради одной страницы значит засорять общее ради частного. */
  .field { display:block; margin:0 0 12px; text-align:left; }
  .field span { display:block; font-size:12px; letter-spacing:1px;
    color:rgba(79,179,224,0.75); margin:0 0 4px; }
  .field input {
    width:100%; box-sizing:border-box; padding:9px 10px;
    background:rgba(5,17,28,0.9); color:#d8f2ff;
    border:1px solid rgba(79,179,224,0.35); border-radius:2px;
    font:15px Consolas, monospace; letter-spacing:1px;
  }
  .field input:focus { outline:none; border-color:#4fb3e0; }
  .err { color:#ff7a66; min-height:18px; margin:4px 0 12px; font-size:13px; }
  .who { color:#78e08f; }
</style>
</head>
<body>
<div class="overlay">
  <div class="panel">
    <h1>SOLAR TRADER</h1>
    <p class="sub" id="subTitle"></p>

    <form id="form" autocomplete="on">
      <label class="field"><span id="lbLogin"></span>
        <input id="login" name="login" autocomplete="username" autocapitalize="off"
               spellcheck="false" required></label>
      <label class="field"><span id="lbPass"></span>
        <input id="pass" name="pass" type="password" autocomplete="current-password" required></label>
      <p class="err" id="err"></p>
      <button class="btn" id="go" type="submit"></button>
    </form>

    <div id="have" style="display:none">
      <p class="who" id="whoLine"></p>
      <button class="btn" id="play"></button>
      <button class="btn ghost" id="out"></button>
    </div>

    <p class="sub" id="note"></p>
    <p class="sub">
      <button class="btn ghost" id="langEn">ENGLISH</button>
      <button class="btn ghost" id="langRu">РУССКИЙ</button>
    </p>
  </div>
</div>

<script type="module">
import * as api from './js/net/api.js';
import { L, initLang, setLang, getLang, numLocale } from './js/core/lang.js';

initLang();

const $ = (id) => document.getElementById(id);

// Подписи собирает скрипт: держать страницу входа в двух видах значило бы
// править её дважды при каждой мелкой правке.
function paint() {
  $('subTitle').textContent = L('вход пилота');
  $('lbLogin').textContent = L('ЛОГИН');
  $('lbPass').textContent = L('ПАРОЛЬ');
  $('go').textContent = L('ВОЙТИ');
  $('play').textContent = L('В ИГРУ');
  $('out').textContent = L('ВЫЙТИ');
  $('note').innerHTML = L('Регистрации здесь нет: учётную запись заводят командой')
    + ' <b>php server/cli/player.php add &lt;логин&gt; &lt;пароль&gt;</b>. '
    + L('Играть без сервера —')
    + ' <a href="index.html?offline=1" style="color:#4fb3e0">' + L('автономно') + '</a>.';
  for (const [code, id] of [['en', 'langEn'], ['ru', 'langRu']]) {
    $(id).classList.toggle('on', getLang() === code);
  }
}
for (const [code, id] of [['en', 'langEn'], ['ru', 'langRu']]) {
  $(id).addEventListener('click', () => { setLang(code); paint(); });
}
paint();
const err = $('err');
const form = $('form');

const fail = (text) => { err.textContent = text; };

/**
 * Если вход уже выполнен, спрашивать пароль снова незачем — но и
 * утверждать, что он рабочий, нельзя: токен мог протухнуть. Поэтому
 * страница сначала спрашивает сервер, кто мы, и только потом решает,
 * что показать.
 */
async function whoAmI() {
  if (!api.online()) return null;
  try {
    const st = await api.state();
    return st.player;
  } catch (e) {
    // Протухший токен api.js уже забыл — просто показываем форму.
    if (e.code !== 'auth') fail(L('сервер не отвечает: ') + e.message);
    return null;
  }
}

const toGame = () => location.replace('index.html');

whoAmI().then((me) => {
  if (!me) {
    $('login').focus();
    return;
  }
  form.style.display = 'none';
  $('have').style.display = '';
  $('note').style.display = 'none';
  $('whoLine').textContent = L('ВХОД ВЫПОЛНЕН: ') + (me.name || me.login)
    + ' · ' + me.balance.toLocaleString(numLocale()) + ' ' + L('кр');
  $('play').addEventListener('click', toGame);
  $('out').addEventListener('click', async () => {
    await api.logout();
    location.reload();
  });
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('go');
  btn.disabled = true;
  fail('');
  try {
    await api.login($('login').value.trim(), $('pass').value);
    toGame();
  } catch (ex) {
    // Сообщение сервера показываем как есть: оно написано для человека,
    // и переписывать его здесь значит заводить вторую версию текста.
    fail(ex.message);
    btn.disabled = false;
    $('pass').value = '';
    $('pass').focus();
  }
});
</script>
</body>
</html>
